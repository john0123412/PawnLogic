# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PawnLogic — Publish to PyPI
# Triggered by tag push matching v*.*.*
# Runs full test gate + dynamic E2E before OIDC publishing
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Publish to PyPI

# Use a simple GitHub glob for tag dispatch, then validate the exact package
# version inside the build job before upload.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:               # Manual trigger; choose testpypi for dry-run
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.target || 'tag' }}
  cancel-in-progress: false        # Publishing must not be interrupted

permissions:
  contents: read

jobs:
  # ── Release source gate: a production tag must point at main ───────
  # This job always runs so that workflow_dispatch dry-runs are not skipped
  # by a skipped dependency; the check itself only applies to tag pushes.
  verify-release-source:
    name: "🔒 Verify release source"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0           # Need history to prove ancestry

      - name: Tag commit must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not"
            echo "contained in origin/main. Production releases must be tagged"
            echo "from a reviewed main commit."
            exit 1
          fi
          echo "Tag commit $GITHUB_SHA is contained in origin/main."

      - name: Source check not applicable
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Not a tag push; the release source check does not apply."

  # ── FIX #2: Run tests before publishing ────────────────────────────
  test-before-publish:
    name: "✅ Test before publish"
    needs: verify-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 10            # FIX #4

    env:
      PAWNLOGIC_TEST_MODE: "true"
      MCP_ENABLED: "false"
      PAWNLOGIC_HOME: /tmp/pawnlogic-publish-test
      TERM: "dumb"
      NO_COLOR: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0           # Release consistency compares against tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Lint
        run: python3 -m ruff check . --output-format=github

      - name: Validate release consistency
        run: python3 tools/check_release_consistency.py

      - name: Validate translated document structure
        run: python3 tools/check_doc_structure.py

      - name: Syntax check
        run: python3 -m compileall -q core/ tools/ utils/ tests/

      - name: Run tests
        run: python3 -m pytest tests/ -v --tb=short --timeout=60

  # ── Dynamic E2E tests ──────────────────────────────────────────────
  dynamic-test:
    name: "🤖 Dynamic E2E (Agent→Agent)"
    needs: test-before-publish
    runs-on: ubuntu-22.04
    timeout-minutes: 8

    env:
      PAWNLOGIC_TEST_MODE: "true"
      MCP_ENABLED: "false"
      PAWNLOGIC_HOME: /tmp/pawnlogic-publish-e2e
      DEEPSEEK_API_KEY: "ci-dummy-not-a-real-key"
      PAWN_API_KEY: "ci-placeholder-key"
      ANTHROPIC_API_KEY: "ci-anthropic-placeholder"
      TERM: "dumb"
      NO_COLOR: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Run E2E tests
        run: python3 -m pytest tests/test_e2e.py -v --tb=short --timeout=30

      - name: Upload E2E test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-publish
          path: |
            tests/test_e2e.py
            pytest-*.log
          retention-days: 7

  # ── Build distributions ──────────────────────────────────────────
  build-distributions:
    name: "📦 Build distributions"
    needs: [test-before-publish, dynamic-test]  # Both gates must pass
    runs-on: ubuntu-latest
    timeout-minutes: 10            # FIX #4
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      wheel: ${{ steps.identity.outputs.wheel }}
      wheel_sha256: ${{ steps.identity.outputs.wheel_sha256 }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build tools
        run: python3 -m pip install build twine

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python3 - <<'PY'
          from config.paths import VERSION
          print(VERSION)
          PY
          )"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package version $package_version"
            exit 1
          fi

      - name: Build
        run: python3 -m build

      # FIX #3: Validate package integrity before publishing.
      - name: Validate package (twine check)
        run: python3 -m twine check dist/*

      # Pin exactly what this run built. The post-upload smoke compares the
      # index copy against these hashes, so skip-existing cannot silently
      # leave an older file in place and still report success.
      - name: Record artifact identity
        id: identity
        run: |
          version="$(python3 -c 'from config.paths import VERSION; print(VERSION)')"
          wheel="pawnlogic-${version}-py3-none-any.whl"
          sdist="pawnlogic-${version}.tar.gz"

          for f in "$wheel" "$sdist"; do
            if [ ! -f "dist/$f" ]; then
              echo "Expected dist/$f was not built."
              ls -la dist
              exit 1
            fi
          done

          found="$(find dist -maxdepth 1 -type f | wc -l)"
          if [ "$found" -ne 2 ]; then
            echo "Expected exactly 2 artifacts, found $found."
            ls -la dist
            exit 1
          fi

          sha256sum dist/* | tee dist-sha256.txt
          {
            echo "version=${version}"
            echo "wheel=${wheel}"
            echo "wheel_sha256=$(sha256sum "dist/$wheel" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact hashes
        uses: actions/upload-artifact@v7
        with:
          name: dist-sha256
          path: dist-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Extract GitHub Release notes from CHANGELOG
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = (
              rf"^## \[{re.escape(version)}\] - [^\n]*\n"
              rf".*?(?=^## \[[0-9]+\.[0-9]+\.[0-9]+\] - |\Z)"
          )
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          if not match:
              print(f"CHANGELOG.md has no release section for {version}", file=sys.stderr)
              sys.exit(1)

          notes = match.group(0).strip()
          if "### " not in notes:
              print(
                  f"CHANGELOG.md release section for {version} has no detail headings",
                  file=sys.stderr,
              )
              sys.exit(1)

          Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Upload GitHub Release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: github-release-notes
          path: release_notes.md
          if-no-files-found: error
          retention-days: 7

  # ── Publish with PyPI Trusted Publishing / OIDC ───────────────────
  publish-testpypi:
    name: "🚀 Publish to TestPyPI"
    needs: build-distributions
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pawnlogic/
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-testpypi:
    name: "🔬 TestPyPI install smoke"
    needs: [build-distributions, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXPECTED_VERSION: ${{ needs.build-distributions.outputs.version }}
      EXPECTED_WHEEL: ${{ needs.build-distributions.outputs.wheel }}
      EXPECTED_SHA256: ${{ needs.build-distributions.outputs.wheel_sha256 }}
      INDEX_URL: https://test.pypi.org/simple/

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/checkout@v6   # Needed for tools/release_install_smoke.sh

      - name: Round-trip smoke
        run: tools/release_install_smoke.sh

  publish-pypi:
    name: "🚀 Publish to PyPI"
    needs: build-distributions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pawnlogic/
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-pypi:
    name: "🔬 PyPI install smoke"
    needs: [build-distributions, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXPECTED_VERSION: ${{ needs.build-distributions.outputs.version }}
      EXPECTED_WHEEL: ${{ needs.build-distributions.outputs.wheel }}
      EXPECTED_SHA256: ${{ needs.build-distributions.outputs.wheel_sha256 }}
      INDEX_URL: https://pypi.org/simple/

    steps:
      - uses: actions/checkout@v6   # Needed for tools/release_install_smoke.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Round-trip smoke
        run: tools/release_install_smoke.sh

  github-release:
    name: "🏷️ Create GitHub Release"
    needs: smoke-pypi              # A release must not claim an uninstallable version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Download GitHub Release notes
        uses: actions/download-artifact@v7
        with:
          name: github-release-notes
          path: .

      # Create GitHub Release only for tag pushes, not workflow_dispatch dry-runs.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
