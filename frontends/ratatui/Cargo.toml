[package]
name = "pawnlogic-tui"
version = "0.3.8"
edition = "2021"
description = "RatatuI frontend for the PawnLogic headless serve protocol (Phase 2b)"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
